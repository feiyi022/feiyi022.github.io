<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="非一工作台">
  <defs>
    <linearGradient id="gTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e2bd7e"/>
      <stop offset="1" stop-color="#b28a4f"/>
    </linearGradient>
    <linearGradient id="gLeft" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a97e45"/>
      <stop offset="1" stop-color="#7d592c"/>
    </linearGradient>
    <linearGradient id="gRight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8a6234"/>
      <stop offset="1" stop-color="#5e3f1b"/>
    </linearGradient>
    <linearGradient id="gTopGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff4d6" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="leftClip"><polygon points="32,6 11,17 11,36 32,25"/></clipPath>
    <clipPath id="rightClip"><polygon points="32,6 53,17 53,36 32,25"/></clipPath>
  </defs>

  <!-- 底面接触阴影 -->
  <ellipse cx="32" cy="50" rx="27" ry="5" fill="#241503" opacity="0.35"/>

  <!-- 右侧面（深色） -->
  <polygon points="32,6 53,17 53,36 32,25" fill="url(#gRight)"/>
  <!-- 左侧面（中色） -->
  <polygon points="32,6 11,17 11,36 32,25" fill="url(#gLeft)"/>
  <!-- 顶面（亮色工作面板） -->
  <polygon points="32,6 53,17 32,28 11,17" fill="url(#gTop)"/>

  <!-- 顶面侧光高光 -->
  <polygon points="32,6 53,17 32,28 11,17" fill="url(#gTopGlow)"/>

  <!-- 顶面木板分隔/侧拼缝（3x3 合成网格） -->
  <g stroke="#4a2f12" stroke-width="1.4" opacity="0.9" fill="none">
    <line x1="39" y1="9.7" x2="18" y2="20.7"/>
    <line x1="46" y1="13.3" x2="25" y2="24.3"/>
    <line x1="25" y1="9.7" x2="46" y2="21.7"/>
    <line x1="18" y1="13.3" x2="39" y2="25.3"/>
  </g>
  <!-- 顶面外框压线 -->
  <polygon points="32,6 53,17 32,28 11,17" fill="none" stroke="#33200c" stroke-width="1.1" opacity="0.6"/>

  <!-- 左侧面木板竖缝 -->
  <g stroke="#5a3c1c" stroke-width="1" opacity="0.55">
    <line x1="20" y1="12.3" x2="20" y2="31.3"/>
    <line x1="26" y1="9.1" x2="26" y2="28.1"/>
  </g>
  <!-- 右侧面木板竖缝 -->
  <g stroke="#4a2f12" stroke-width="1" opacity="0.5">
    <line x1="41" y1="10.7" x2="41" y2="31.3"/>
    <line x1="47" y1="13.9" x2="47" y2="28.1"/>
  </g>

  <!-- 左侧工具浮雕：锤子 -->
  <g clip-path="url(#leftClip)">
    <g opacity="0.5">
      <!-- 锤头 -->
      <rect x="13" y="16" width="12" height="5" fill="#d8dee3"/>
      <rect x="14" y="16.6" width="6" height="1.6" fill="#ffffff"/>
      <!-- 锤柄 -->
      <rect x="17.5" y="21" width="3" height="12" fill="#2c1a08"/>
    </g>
    <g opacity="0.5" transform="translate(0.6 0.8)">
      <rect x="13" y="16" width="12" height="5" fill="#39414a"/>
      <rect x="17.5" y="21" width="3" height="12" fill="#0e0802"/>
    </g>
  </g>

  <!-- 右侧工具浮雕：锯子 -->
  <g clip-path="url(#rightClip)">
    <g opacity="0.45">
      <polygon points="40,22 52,30 49,33 38,26" fill="#d8dee3"/>
      <rect x="45.5" y="16.5" width="3.4" height="9" fill="#2c1a08" transform="rotate(24 47 20)"/>
    </g>
    <g opacity="0.45" transform="translate(0.6 0.8)">
      <polygon points="40,22 52,30 49,33 38,26" fill="#39414a"/>
    </g>
  </g>

  <!-- 底缘环境光遮挡（左右面底部加深） -->
  <g opacity="0.14">
    <polygon points="11,32 11,36 32,47 32,43" fill="#000"/>
    <polygon points="53,32 53,36 32,47 32,43" fill="#000"/>
  </g>

  <!-- 棱线：中心竖棱 + 左右轮廓 -->
  <g stroke="#2a1706" stroke-width="1.4" stroke-linejoin="round" fill="none">
    <line x1="32" y1="6" x2="32" y2="25"/>
    <line x1="11" y1="17" x2="11" y2="36"/>
    <line x1="53" y1="17" x2="53" y2="36"/>
  </g>
  <!-- 顶缘高光（模拟受光） -->
  <polyline points="11,17 32,6 53,17" fill="none" stroke="#fff3d0" stroke-width="1.6" opacity="0.8" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- 整体外轮廓 -->
  <polygon points="32,6 53,17 53,36 32,47 11,36 11,17" fill="none" stroke="#241503" stroke-width="1.8" stroke-linejoin="round" opacity="0.55"/>
</svg>
